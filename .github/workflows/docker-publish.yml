name: Publish image

# Image publication is an explicit maintainer action. Source pushes run CI
# without publishing a container or deploying a service.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # The template repositories themselves publish no image; forks do.
    if: ${{ !startsWith(github.repository, 'Query-farm/vgi-starter-') }}
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [ci]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: Query-farm/vgi-actions/.github/workflows/docker-publish.yml@v1
    secrets: inherit
    with:
      image_name: vgi-earth-observation-worker
      smoke_import: "earth_observation_worker, vgi, pyarrow"
      health_port: "8000"
      version_check_cmd: "ci/check-version.sh"
